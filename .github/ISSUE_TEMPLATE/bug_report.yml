name: Bug report
description: Report a reproducible HOMEii problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: HOMEii version
      placeholder: 6.0.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and reproduction steps.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options: [Add-on, Web UI, Ingress, Home Assistant integration, PWA]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
