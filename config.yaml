name: "HOMEii Network Monitor Beta"
slug: "homeii-network-monitor-beta"
description: "Local network operations with an automatically managed Zabbix engine and offline operation"
version: "8.0.0-beta.2"
build: .
startup: services
boot: auto
init: false
host_network: true
arch:
  - amd64
  - aarch64
ports:
  8384/tcp: 8384
  8444/tcp: 8444
webui: "http://[HOST]:[PORT:8384]"
ingress: true
ingress_port: 8384
backup: cold
timeout: 120
map:
  - share:rw
  - ssl:ro
watchdog: "http://[HOST]:[PORT:8384]/api/health/live"
panel_icon: mdi:shield-check-outline
options:
  networks:
    - 192.168.1.0/24
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  networks:
    - str
  ssl: bool
  certfile: str
  keyfile: str
