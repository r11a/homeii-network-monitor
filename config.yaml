name: "HOMEii Network Monitor"
slug: "homeii-network-monitor"
description: "SQLite-based network monitor with configurable discovery, stable network assignment and vendor detection"
version: "6.7.0"
build: .
startup: services
boot: auto
init: false
host_network: true
arch:
  - amd64
  - aarch64
ports:
  8383/tcp: 8383
webui: "http://[HOST]:[PORT:8383]"
ingress: true
ingress_port: 8383
watchdog: "http://[HOST]:[PORT:8383]/api/health/live"
panel_icon: mdi:shield-check-outline
options:
  networks:
    - 192.168.1.0/24
schema:
  networks:
    - str
